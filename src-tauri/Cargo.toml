[package]
name = "vlauncher"
version = "0.2.1"
description = "Um launcher para os projetos em que você trabalha: grupos, variações, branches e worktrees"
authors = ["Vinícius Ventura"]
license = "MIT"
edition = "2021"
# Além do launcher, o `vl` (src/bin/vl.rs), a linha de comando que fala com ele.
default-run = "vlauncher"

[lib]
name = "vlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# O canal local do `vl` (src/canal.rs): o named pipe do tokio, o mesmo runtime que o Tauri já usa.
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
# A mesma versão que as dependências do Tauri já trazem. A WM_NCACTIVATE (src/vidro.rs) e o que o
# monitor lê do Windows (src/monitor.rs): os processos, a CPU, a memória e as portas.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
